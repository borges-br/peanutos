version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # POSTGRESQL DATABASE
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: peanut_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peanut_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-peanut_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peanut_user -d peanut_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # REDIS (BullMQ queues, cache and Web session stores)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: peanut_redis
    restart: always
    command: redis-server --requirepass change-me-in-production
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "change-me-in-production", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MINIO OBJECT STORAGE (S3-compatible bucket storage for imutable PDFs)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio
    container_name: peanut_minio
    restart: always
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
