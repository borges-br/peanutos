services:
  # ----------------------------------------------------------------------------
  # POSTGRESQL DATABASE
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: peanut_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peanut_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-peanut_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peanut_user -d peanut_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # REDIS (BullMQ queues, cache and Web session stores)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: peanut_redis
    restart: always
    command: redis-server --requirepass change-me-in-production
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "change-me-in-production", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
