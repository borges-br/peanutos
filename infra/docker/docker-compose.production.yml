name: peanut-os

x-app-env: &app-env
  NODE_ENV: production
  NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-https://localhost}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
  API_BODY_LIMIT_BYTES: ${API_BODY_LIMIT_BYTES:-26214400}
  CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
  DATABASE_URL: postgresql://${POSTGRES_USER:-peanut_user}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-peanut_db}?schema=public
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-in-production}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-at-least-32-chars-long}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
  APPLICATION_ENCRYPTION_KEY: ${APPLICATION_ENCRYPTION_KEY:-}
  STORAGE_PATH: /data/storage
  WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-peanut-os-webhook-key-change-in-production!!}
  WEBHOOK_MAX_CONCURRENCY: ${WEBHOOK_MAX_CONCURRENCY:-5}
  PDF_MAX_CONCURRENCY: ${PDF_MAX_CONCURRENCY:-1}

services:
  # Caddy mode: use this service when Peanut OS should manage HTTP, HTTPS,
  # Let's Encrypt certificates, and reverse proxying by itself.
  # If you use NGINX Proxy Manager, add docker-compose.npm.yml to your compose
  # command; that override moves this service behind an inactive profile.
  caddy:
    image: caddy:2-alpine
    container_name: peanut-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    environment:
      PEANUT_DOMAIN: ${PEANUT_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  web:
    # Internal Next.js service. Caddy or NGINX Proxy Manager should proxy to
    # this container on port 3000; it is intentionally not published directly.
    image: ${PEANUT_IMAGE_REGISTRY:-ghcr.io}/${PEANUT_IMAGE_NAMESPACE:-owner/peanutos}/peanut-web:${PEANUT_IMAGE_TAG:-latest}
    container_name: peanut-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    expose:
      - "3000"

  api:
    # Internal NestJS API service. Reverse proxies should forward /api/v1 to
    # this container on port 3001; keep the database and queues private.
    image: ${PEANUT_IMAGE_REGISTRY:-ghcr.io}/${PEANUT_IMAGE_NAMESPACE:-owner/peanutos}/peanut-api:${PEANUT_IMAGE_TAG:-latest}
    container_name: peanut-api
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT_API: 3001
    volumes:
      - storage_data:/data/storage
    expose:
      - "3001"

  worker:
    image: ${PEANUT_IMAGE_REGISTRY:-ghcr.io}/${PEANUT_IMAGE_NAMESPACE:-owner/peanutos}/peanut-worker:${PEANUT_IMAGE_TAG:-latest}
    container_name: peanut-worker
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - storage_data:/data/storage

  migrator:
    # One-shot startup job. It applies pending Prisma migrations, exits 0, and
    # then api/worker are allowed to start. Re-running it is safe.
    image: ${PEANUT_IMAGE_REGISTRY:-ghcr.io}/${PEANUT_IMAGE_NAMESPACE:-owner/peanutos}/peanut-migrator:${PEANUT_IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env

  postgres:
    image: postgres:16-alpine
    container_name: peanut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peanut_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-peanut_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peanut_user} -d ${POSTGRES_DB:-peanut_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: peanut-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me-in-production}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-in-production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  storage_data:
    name: peanut_storage_data
